:root{
  --bg:#12002b;
  --surface:#1d0447;
  --surface-2:#2a0a5e;
  --ink:#ffffff;
  --muted:#d8c8ff;
  --cyan:#22e6ff;
  --pink:#ff3ea8;
  --lime:#a6ff4d;
  --gold:#ffd34d;
  --line:rgba(34,230,255,.55);
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#12002b;
    --surface:#1d0447;
    --surface-2:#2a0a5e;
    --ink:#ffffff;
    --muted:#d8c8ff;
  }
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:ui-sans-system, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

button,input{
  font:inherit;
}

button{
  -webkit-tap-highlight-color:transparent;
  cursor:pointer;
}

button:active{
  transform:scale(.95);
}

.btn{
  width:100%;
  border:0;
  border-radius:16px;
  padding:15px 14px;
  font-weight:900;
  letter-spacing:.02em;
  color:#12002b;
  background:linear-gradient(90deg,var(--cyan),var(--pink));
  box-shadow:0 6px 0 #5d0a52, 0 0 22px rgba(255,62,168,.35);
  transition:transform .08s ease;
}

.btn:active{
  transform:scale(.95);
}

.btn-ghost{
  background:#2a0a5e;
  color:white;
  border:1px solid var(--line);
  box-shadow:none;
}

.btn-dark{
  background:#0a0120;
  color:#fff;
  border:1px solid rgba(255,255,255,.2);
  box-shadow:none;
}

.neon{
  border:1px solid var(--line);
  background:linear-gradient(145deg, rgba(34,230,255,.10), rgba(255,62,168,.09));
  box-shadow:0 0 0 1px rgba(255,255,255,.05), 0 0 24px rgba(34,230,255,.10);
  border-radius:20px;
}

.field{
  width:100%;
  border:1px solid rgba(255,255,255,.22);
  background:#0a0120;
  color:#fff;
  border-radius:14px;
  padding:14px;
  font-weight:800;
  outline:none;
}

.field:focus{
  border-color:var(--cyan);
  box-shadow:0 0 0 3px rgba(34,230,255,.18);
}

.choice{
  text-align:left;
  width:100%;
  border-radius:18px;
  padding:15px;
  background:#1d0447;
  color:#fff;
  border:1px solid rgba(255,255,255,.16);
  transition:transform .08s ease;
}

.choice:active{
  transform:scale(.95);
  border-color:var(--cyan);
}

.choice:disabled{
  opacity:.55;
}

.timer-bar{
  height:8px;
  background:rgba(255,255,255,.15);
  border-radius:99px;
  overflow:hidden;
}

.timer-fill{
  height:100%;
  background:linear-gradient(90deg,var(--cyan),var(--pink));
  transition:width .5s linear;
}

.small{
  font-size:13px;
  line-height:1.45;
}

@media (min-width: 640px) {
  .sm\:-mx-5 {
    margin-left: -1.25rem;
    margin-right: -1.25rem;
  }

  .sm\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .sm\:p-5 {
    padding: 1.25rem;
  }

  .sm\:px-5 {
    padding-left: 1.25rem;
    padding-right: 1.25rem;
  }
}
