  background:linear-gradient(145deg, rgba(29,10,61,.92), rgba(10,0,20,.92));
  border:1px solid rgba(0,240,255,.28);
  box-shadow:0 12px 40px rgba(0,0,0,.45), inset 0 0 30px rgba(161,0,255,.12);
}

.btn{
  transition:transform .12s ease, filter .15s ease, box-shadow .15s ease;
  -webkit-user-select:none;
     -moz-user-select:none;
          user-select:none;
  cursor:pointer;
}

.btn:active{
  transform:scale(.94) !important;
}

.btn:hover{
  filter:brightness(1.14);
}

@keyframes floaty{
  0%,100%{
    transform:translateY(0) rotate(-2deg);
  }

  50%{
    transform:translateY(-10px) rotate(2deg);
  }
}

@keyframes pulseGlow{
  0%,100%{
    transform:scale(1);
    filter:brightness(1);
  }

  50%{
    transform:scale(1.04);
    filter:brightness(1.35);
  }
}

@keyframes blink{
  0%,100%{
    opacity:1;
  }

  50%{
    opacity:.15;
  }
}

@keyframes popIn{
  from{
    opacity:0;
    transform:translateY(18px) scale(.94);
  }

  to{
    opacity:1;
    transform:none;
  }
}

@keyframes slideIn{
  from{
    opacity:0;
    transform:translateX(34px);
  }

  to{
    opacity:1;
    transform:none;
  }
}

@keyframes shakeX{
  0%,100%{
    transform:translateX(0);
  }

  20%{
    transform:translateX(-10px);
  }

  40%{
    transform:translateX(9px);
  }

  60%{
    transform:translateX(-7px);
  }

  80%{
    transform:translateX(5px);
  }
}

@keyframes rotatePhone{
  0%,20%{
    transform:rotate(0deg);
  }

  45%,75%{
    transform:rotate(90deg);
  }

  100%{
    transform:rotate(0deg);
  }
}

@keyframes scan{
  from{
    transform:translateY(-100%);
  }

  to{
    transform:translateY(100vh);
  }
}

@keyframes spinSlow{
  to{
    transform:rotate(360deg);
  }
}

@keyframes confettiFall{
  0%{
    transform:translateY(-20px) rotate(0deg);
    opacity:1;
  }

  100%{
    transform:translateY(520px) rotate(720deg);
    opacity:0;
  }
}

@keyframes boom{
  0%{
    transform:scale(.4);
    opacity:1;
  }

  100%{
    transform:scale(2.2);
    opacity:0;
  }
}

@keyframes marquee{
  from{
    transform:translateX(0);
  }

  to{
    transform:translateX(-50%);
  }
}

.anim-pop{
  animation:popIn .35s ease both;
}

.anim-slide{
  animation:slideIn .35s ease both;
}

.anim-shake{
  animation:shakeX .45s ease;
}

.anim-float{
  animation:floaty 3.2s ease-in-out infinite;
}

.anim-pulse{
  animation:pulseGlow 1.6s ease-in-out infinite;
}

.anim-blink{
  animation:blink 1s steps(2) infinite;
}

.scanline{
  position:absolute;
  left:0;
  right:0;
  height:120px;
  background:linear-gradient(transparent, rgba(0,240,255,.07), transparent);
  animation:scan 7s linear infinite;
  pointer-events:none;
}

.no-scrollbar::-webkit-scrollbar{
  display:none;
}

.no-scrollbar{
  scrollbar-width:none;
}

input,select{
  font-family:inherit;
}

input:focus{
  outline:2px solid var(--cyan);
}

.hover\:border-yellow-300:hover{
  --tw-border-opacity: 1;
  border-color: rgb(253 224 71 / var(--tw-border-opacity, 1));
}

.disabled\:opacity-40:disabled{
  opacity: 0.4;
}

.disabled\:opacity-50:disabled{
  opacity: 0.5;
}

@media (min-width: 640px){
  .sm\:inline{
    display: inline;
  }

  .sm\:w-32{
    width: 8rem;
  }

  .sm\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .sm\:gap-5{
    gap: 1.25rem;
  }

  .sm\:p-5{
    padding: 1.25rem;
  }

  .sm\:p-7{
    padding: 1.75rem;
  }

  .sm\:p-9{
    padding: 2.25rem;
  }

  .sm\:px-5{
    padding-left: 1.25rem;
    padding-right: 1.25rem;
  }

  .sm\:pt-5{
    padding-top: 1.25rem;
  }

  .sm\:text-2xl{
    font-size: 1.5rem;
    line-height: 2rem;
  }

  .sm\:text-3xl{
    font-size: 1.875rem;
    line-height: 2.25rem;
  }

  .sm\:text-4xl{
    font-size: 2.25rem;
    line-height: 2.5rem;
  }

  .sm\:text-6xl{
    font-size: 3.75rem;
    line-height: 1;
  }

  .sm\:text-7xl{
    font-size: 4.5rem;
    line-height: 1;
  }

  .sm\:text-lg{
    font-size: 1.125rem;
    line-height: 1.75rem;
  }

  .sm\:text-sm{
    font-size: 0.875rem;
    line-height: 1.25rem;
  }

  .sm\:text-xl{
    font-size: 1.25rem;
    line-height: 1.75rem;
  }
}

@media (min-width: 768px){
  .md\:inline{
    display: inline;
  }

  .md\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .md\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

@media (min-width: 1024px){
  .lg\:w-\[45\%\]{
    width: 45%;
  }

  .lg\:w-\[55\%\]{
    width: 55%;
  }

  .lg\:grid-cols-\[1fr_1\.25fr\]{
    grid-template-columns: 1fr 1.25fr;
  }

  .lg\:flex-row{
    flex-direction: row;
  }

  .lg\:gap-6{
    gap: 1.5rem;
  }
}
