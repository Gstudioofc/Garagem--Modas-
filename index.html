.grid {
  display: grid;
}

.hidden {
  display: none;
}

.resize {
  resize: both;
}

.filter {
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

:root{
  --bg:#120826;
  --surface:#241145;
  --surface2:#321a5e;
  --line:#ffffff26;
  --text:#fff8ee;
  --muted:#d8c8ff;
  --primary:#ff6b35;
  --accent:#ffd23f;
  --green:#3ddc84;
  --red:#ff5470;
  --blue:#4cc9f0;
  --violet:#8b5cf6;
  --safe-area-inset-top:0px;
}

*{
  box-sizing:border-box
}

html,body,#root{
  margin:0;
  min-height:100%;
  background:#070312
}

body{
  font-family:ui-rounded,"Arial Rounded MT Bold",Verdana,sans-serif;
  color:var(--text);
  overflow-x:clip
}

button,input,select{
  font:inherit
}

button{
  cursor:pointer
}

button:disabled{
  opacity:.45;
  cursor:not-allowed
}

input,select{
  color:#1c1233;
  background:#fff;
  border:2px solid #d9cfff;
  border-radius:12px;
  padding:10px 12px;
  outline:none;
  width:100%
}

input:focus,select:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px #ff6b3540
}

.landscape-shell{
  width:min(1280px,100vw);
  aspect-ratio:16/9;
  max-height:100vh;
  margin:auto;
  position:relative;
  overflow:hidden;
  background:radial-gradient(circle at 12% 8%,#ff6b3566,transparent 28%),radial-gradient(circle at 88% 12%,#ffd23f45,transparent 30%),linear-gradient(125deg,#3b1470,#1d0a46 58%,#571d69);
  border-radius:22px;
  box-shadow:0 20px 70px #0009
}

@media(max-width:820px){
  .landscape-shell{
    border-radius:0;
    aspect-ratio:auto;
    height:100vh;
    max-height:none
  }
}

.scroll{
  overflow-y:auto;
  scrollbar-width:thin;
  scrollbar-color:#ff6b35 transparent
}

.card{
  background:linear-gradient(145deg,#ffffff1d,#ffffff0a);
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:0 8px 24px #0003
}

.btn{
  background:var(--primary);
  color:white;
  border:0;
  border-radius:999px;
  padding:11px 18px;
  font-weight:900;
  box-shadow:0 5px 0 #a52f0f;
  transition:.15s
}

.btn:active{
  transform:translateY(3px);
  box-shadow:0 2px 0 #a52f0f
}

.btn-yellow{
  background:var(--accent);
  color:#3a2100;
  box-shadow:0 5px 0 #b98a00
}

.btn-ghost{
  background:#ffffff1a;
  color:white;
  box-shadow:none;
  border:1px solid #ffffff35
}

.btn-green{
  background:var(--green);
  color:#052e18;
  box-shadow:0 5px 0 #137a47
}

.small{
  font-size:12px;
  line-height:1.35
}

.muted{
  color:var(--muted)
}

.big-title{
  font-size:clamp(44px,8vw,92px);
  line-height:.78;
  letter-spacing:-4px;
  font-weight:1000;
  text-shadow:0 7px 0 #6c1eac,0 14px 28px #0008
}

.pulse{
  animation:pulse 1s infinite
}

.float{
  animation:float 3.5s ease-in-out infinite
}

@keyframes pulse{
  50%{
    transform:scale(1.06)
  }
}

@keyframes float{
  50%{
    transform:translateY(-6px)
  }
}

@keyframes pop{
  from{
    transform:scale(.92);
    opacity:0
  }

  to{
    transform:scale(1);
    opacity:1
  }
}

.pop{
  animation:pop .25s ease-out
}

.chip{
  display:inline-flex;
  align-items:center;
  gap:6px;
  background:#ffffff18;
  border:1px solid #ffffff2d;
  border-radius:999px;
  padding:5px 9px;
  font-size:11px;
  font-weight:800
}

.theme-praia{
  --bg:#083344;
  --surface:#0e5b63;
  --surface2:#117a6a;
  --primary:#ff7a3d
}

.theme-floresta{
  --bg:#102a16;
  --surface:#1c4a2d;
  --surface2:#265f38;
  --primary:#ff8b34
}

.theme-neon{
  --bg:#050914;
  --surface:#121d38;
  --surface2:#1b2a52;
  --primary:#ff2e88
}

.large-text{
  font-size:17px
}

.large-text .small{
  font-size:14px
}

.high-contrast{
  filter:contrast(1.25) saturate(1.1)
}

.portrait-note{
  display:none
}

@media(orientation:portrait) and (max-width:820px){
  .portrait-note{
    display:flex
  }
}
</style>
